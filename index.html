<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tell crawlers the real site lives on Vercel, so search engines
     credit that URL rather than this redirect stub. -->
<link rel="canonical" href="https://darlinholguin.vercel.app/">

<!-- Runs during head parse, before the body paints, so the fallback
     markup below never flashes on screen. replace() rather than assign()
     so the back button returns where the visitor came from. -->
<script>location.replace("https://darlinholguin.vercel.app/");</script>

<!-- No-JavaScript fallback. -->
<meta http-equiv="refresh" content="0; url=https://darlinholguin.vercel.app/">

<title>Darlin Holguin — Portfolio</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0d0d12;
    color: #e8e8ef;
    text-align: center;
    padding: 1.5rem;
  }
  a { color: #8ab4ff; }
</style>
</head>
<body>
  <main>
    <p>Redirecting to my portfolio&hellip;</p>
    <p>If nothing happens, <a href="https://darlinholguin.vercel.app/">open it here</a>.</p>
  </main>

</body>
</html>
